on:
  - pull_request
  - push

name: CI

jobs:
  run:
    name: Tests

    strategy:
      fail-fast: false
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions: [ '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
        psr-log-versions: [ '^1', '^2', '^3' ]

    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Install dependencies with composer
        run: composer install

      - name: Verify documentation is current
        run: ./vendor/bin/mddoc --dry-run=true

      - name: Install PSR Log
        run: |
          composer remove --dev donatj/mddoc
          composer require --with-all-dependencies psr/log:${{ matrix.psr-log-versions }}

      - name: Run tests
        run: make test

      - name: Verify code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
